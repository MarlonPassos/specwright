name: spec-driven
version: 1
description: Workflow padrão - proposal -> specs -> design -> tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Enuncia o problema, o escopo da change e as capacidades que ela toca
    template: proposal.md
    requires: []
    instruction: |
      Escreva o documento que responde POR QUE esta change existe e O QUE ela cobre.

      Seções obrigatórias:
      - **Origem**: só quando a change nasce de um incremento de um Project Plan. O id do
        incremento (`CH-NNN`) e as referências da fonte que o Planned Change dele declara,
        copiadas como estão - são ponteiros, não prosa a reescrever. Apague a seção quando
        não houver plano.

        Esta seção não é decorativa: ela é o único lugar onde a origem da change fica
        registrada dentro da própria change. Sem ela, um requisito do documento-fonte pode
        sumir entre o plano e o código sem que nada acuse.
      - **Why**: uma ou duas frases nomeando o problema ou a oportunidade, e por que importa agora.
      - **What Changes**: uma lista de mudanças concretas. Nomeie comportamento novo, comportamento alterado e remoções. Prefixe um item com **BREAKING** quando ele quebra um contrato existente.
      - **Capabilities**: as specs que esta change vai tocar.
        - **New Capabilities**: capacidades sendo introduzidas. Cada uma vira `specs/<caminho-da-capacidade>/spec.md` dentro da change. Use kebab-case em qualquer segmento de caminho que você introduzir e siga o layout que o projeto já usa.
        - **Modified Capabilities**: capacidades existentes cujos requisitos mudam. Liste uma apenas quando o comportamento observável muda, não quando muda só a implementação. Use o caminho existente exato, sob o diretório `specs/` do workspace.
      - **Impact**: código, interfaces, dados ou dependências afetados.

      A seção Capabilities é o contrato entre este artefato e os deltas de spec. Leia as
      specs existentes antes de preenchê-la - toda capacidade listada aqui precisa de um
      arquivo de delta correspondente.

      Uma change precisa declarar pelo menos uma capacidade ou abrir mão das specs
      explicitamente: a validação rejeita uma change com zero deltas, a não ser que o
      `.change.yaml` dela defina `skip_specs: true` E um `skip_specs_reason`. Use esse
      marcador só quando nenhum comportamento observável muda (refatoração, tooling, docs).
      Nunca invente um requisito para satisfazer a validação.

      A justificativa é obrigatória porque o marcador desliga a única regra que amarra a
      change a um requisito. Sem requisito, a definição de pronto da change vira a própria
      lista de tarefas dela - que já está toda marcada quando alguém vai conferir. Uma
      change de "testes de contrato" e uma de "prontidão de entrega" passaram por aí e
      terminaram sem nenhum requisito na spec viva.

      Seja breve. Como a change é construída pertence ao design.md.

  - id: specs
    generates: "specs/**/*.md"
    description: Delta specs que descrevem o comportamento que o sistema deve ter depois da change
    template: spec.md
    requires:
      - proposal
    instruction: |
      Escreva os contratos de comportamento desta change. Uma spec diz O QUE o sistema
      faz, nunca COMO ele é construído.

      Pertence a uma spec:
      - comportamento que um chamador externo ou um usuário consegue observar
      - entradas, saídas e condições de erro
      - restrições que o produto precisa honrar (segurança, privacidade, compatibilidade, confiabilidade)
      - cenários que podem ser conferidos

      Não pertence a uma spec: nomes internos, escolha de bibliotecas, implementação passo a
      passo. Regra prática - se a implementação pode mudar sem mudar nada observável, não é
      material de spec.

      Três reforços, cada um vindo de uma falha concreta:

      **Capacidade de domínio precisa de requisito de exposição, ou marca de interna.** Se
      uma spec exige uma transição, um estado ou uma operação, alguma spec precisa dizer
      como alguém chega até ela - ou a spec declara explicitamente que é interna. Numa
      auditoria real, uma transição obrigatória de estado foi especificada com regras de
      ator e de guichê, o método existia no domínio, e nenhum caso de uso o chamava e nenhum
      endpoint o expunha. Estado especificado e inalcançável em produção.

      **Um exemplo dentro de um requisito precisa ser alcançável sob a regra que ele
      ilustra.** Uma spec ilustrou numeração com "A001 para normal, P001 para prioridade"
      sob uma regra de contador único por fila - regra que torna esse par impossível numa
      fila mista. O exemplo é lido como contrato; se ele não pode acontecer, ou o exemplo
      está errado ou a regra está.

      **Requisito não funcional relevante é requisito.** Custo de consulta, limite de
      volume, tempo de resposta e comportamento sob concorrência entram como requirement
      quando importam. Nenhuma spec daquele projeto disse nada sobre custo de consulta, e o
      dashboard carrega a fila inteira em memória a cada requisição sem violar spec alguma -
      o que significa que nada nunca vai acusar isso.

      Escreva um arquivo por capacidade listada na proposta, em
      `specs/<caminho-da-capacidade>/spec.md` dentro do diretório da change.
      `<caminho-da-capacidade>` é o diretório relativo a `specs/`, por exemplo
      `user-auth` ou `identity/user-auth`.
      - Capacidade nova: use o caminho exato que a proposta declarou.
      - Capacidade modificada: use o caminho existente exato, do diretório `specs/` do
        workspace. Nunca mova nem renomeie uma capacidade num delta.

      Precisa haver pelo menos um arquivo de delta, a não ser que o `.change.yaml` da change
      defina `skip_specs: true`. Se a proposta não listou nenhuma capacidade e o marcador não
      está lá, corrija a proposta antes.

      Seções de delta (cabeçalhos de nível 2):
      - `## ADDED Requirements` - requisitos que não existiam
      - `## MODIFIED Requirements` - requisitos alterados, carregando o texto atualizado COMPLETO
      - `## REMOVED Requirements` - cada um precisa de linhas **Reason** e **Migration**
      - `## RENAMED Requirements` - só mudanças de nome, na forma FROM:/TO:

      Regras de formato:
      - um requisito é `### Requirement: <nome>` seguido do texto dele
      - o texto normativo usa SHALL ou MUST
      - um cenário é `#### Scenario: <nome>` com marcadores QUANDO/ENTÃO
      - cenários precisam de exatamente quatro cerquilhas; três cerquilhas ou uma lista não são interpretadas
      - todo requisito precisa de pelo menos um cenário

      Um delta de capacidade NOVA começa com uma seção `## Purpose`: uma ou duas frases (50
      caracteres ou mais) dizendo para que serve a capacidade. O arquivamento copia esse
      Purpose para a spec principal que ele cria; sem ele, a nova spec principal fica com um
      placeholder para preencher à mão. NÃO adicione `## Purpose` a um delta de capacidade
      existente - aquela spec já tem um, e a cópia do delta é ignorada. Para mudar um Purpose
      existente, edite direto a spec principal em
      `<workspace>/specs/<caminho-da-capacidade>/spec.md`. Pegue `<workspace>` do campo
      `workspace` de `specs instructions ... --json`; nunca presuma um caminho.

      Modificando um requisito:
      1. encontre-o em `<workspace>/specs/<caminho-da-capacidade>/spec.md`
      2. copie o bloco INTEIRO, de `### Requirement:` até o último cenário dele
      3. cole sob `## MODIFIED Requirements` e edite
      4. mantenha o texto do cabeçalho idêntico ao original

      Um bloco MODIFIED com conteúdo parcial perde o resto no arquivamento. Quando você está
      acrescentando uma preocupação em vez de mudar comportamento existente, use ADDED.

      Exemplo de delta de capacidade nova:
      ```
      ## Purpose

      Permite que as pessoas tirem seus dados do produto num formato portátil.

      ## ADDED Requirements

      ### Requirement: Exportação de dados
      O sistema SHALL permitir que um usuário autenticado exporte seus dados como CSV.

      #### Scenario: Exportação bem-sucedida
      - **QUANDO** o usuário solicita uma exportação
      - **ENTÃO** o sistema retorna um arquivo CSV contendo os dados dele

      ## REMOVED Requirements

      ### Requirement: Exportação legada
      **Reason**: Substituído pelo export CSV acima
      **Migration**: Chame o endpoint de export v2 no lugar
      ```

  - id: design
    generates: design.md
    description: Abordagem técnica e as decisões por trás dela
    template: design.md
    requires:
      - proposal
    instruction: |
      Escreva o documento que responde COMO a change é construída.

      Escreva-o apenas quando pelo menos um destes valer:
      - a change abrange vários módulos ou serviços, ou introduz um padrão novo
      - ela adiciona uma dependência externa ou muda o modelo de dados
      - ela carrega risco de segurança, de performance ou de migração
      - há ambiguidade que vale resolver antes de escrever código

      Se nenhum valer, pule este artefato e diga isso.

      Seções:
      - **Contexto**: apenas o estado atual e as restrições necessárias para acompanhar a abordagem. Aponte para o proposal.md pela motivação, em vez de repeti-la.
      - **Objetivos / Não-objetivos**: o que o design alcança e o que ele deliberadamente deixa de fora.
      - **Decisões**: cada escolha central com a justificativa e as alternativas consideradas.
      - **Riscos / Compensações**: o que pode dar errado, cada um com sua mitigação.
      - **Plano de Migração**: passos de rollout e de rollback, quando for o caso.
      - **Perguntas em Aberto**: duas categorias, tipadas. Omita a seção quando não houver nenhuma.
        - `Q-N · adiável` - incógnita genuína que pode esperar. Não muda spec, abordagem nem tasks.
        - `FU-N · follow-up` - trabalho que é legítimo não fazer aqui e obrigatório fazer depois.
          Carrega `fonte:` (quando vem do documento-fonte) e `destino:` (o que precisa existir).

      Uma questão em aberto é uma incógnita genuinamente adiável, não uma decisão que você
      pulou. Se a resposta mudaria as specs, a abordagem ou a divisão em tarefas, resolva
      agora - pergunte em vez de chutar.

      **A terceira saída de uma pergunta em aberto.** Um caso real, e o mais caro que este
      fluxo já perdeu: um design registrou corretamente que campos de cliente constavam do
      documento-fonte, não existiam no modelo, e que criá-los violaria a regra de "nenhuma
      migration" daquela change. A decisão estava impecável. Foi escrita como pergunta em
      aberto, a change foi arquivada, e o endpoint público de atualização ficou sem nenhum
      campo atualizável.

      A instrução oferecia duas saídas - adiável dentro desta change, ou resolva agora - e o
      caso não era nenhuma das duas. Era "legítimo não fazer aqui, obrigatório fazer depois".
      Sem essa terceira categoria, virou adiável e evaporou.

      Um `FU-` não é uma dúvida: é trabalho que esta change declara que fica para outra. Ele
      precisa sair do design como Planned Change, como item de backlog registrado, ou
      descartado com justificativa - nunca em silêncio.

      **Divergir do documento-fonte.** Quando uma decisão contraria o que a fonte pede, ela
      ganha uma subseção própria em Decisões, com quatro coisas: o que a fonte pedia, com a
      referência de linha; o que se decidiu; por quê; e **o que se perde**.

      A última é a que não costuma ser escrita e é a que importa. Divergir é legítimo e
      frequentemente certo - o problema é divergir sem saber que se está divergindo. Uma
      change redefiniu o envelope de erro e ganhou correlação por requisição, que a fonte
      não previa; perdeu junto o código de erro estável que a fonte especificava com exemplo
      concreto, e o design apresentou o envelope novo como se não houvesse contrato
      anterior. Ninguém decidiu abrir mão daquilo: ninguém percebeu que estava abrindo.

      As referências da fonte que a proposta registra em `## Origem` são o contexto para
      isto. Com elas à mão, a divergência fica difícil de cometer por acidente; sem elas,
      é o caminho natural.

  - id: tasks
    generates: tasks.md
    description: Checklist de implementação ordenado
    template: tasks.md
    requires:
      - specs
      - design
    instruction: |
      Quebre o trabalho num checklist ordenado.

      Antes de escrevê-lo, leia as Perguntas em Aberto do design.md. Resolva com o usuário
      qualquer `Q-` que mudaria o que será construído.

      Um `FU-` é diferente: ele não bloqueia esta change, mas também não pode sumir com ela.
      Leve cada um ao usuário e pergunte qual destino ele quer - Planned Change nova, item
      de backlog, ou descarte com justificativa - antes de fechar as tarefas.

      Siga o template exatamente. A fase de implementação lê a sintaxe de checkbox para
      acompanhar o progresso, então uma linha que não seja `- [ ] X.Y ...` não é acompanhada.

      Regras:
      - agrupe tarefas relacionadas sob cabeçalhos numerados `## N. <grupo>`
      - numere as tarefas `X.Y` dentro do grupo, em ordem
      - ordene por dependência: o que precisa existir primeiro vem primeiro
      - mantenha cada tarefa pequena o bastante para terminar de uma sentada
      - toda tarefa diz como é verificada - um teste, um comando, um resultado observável
        ou um artefato entregue - dentro do próprio texto do checkbox. Adicione uma tarefa
        de verificação separada só para comportamento que atravessa várias tarefas
      - **a condição de sucesso nunca pode ser um teste ser pulado, ignorado ou condicional.**
        Se a change entrega um teste, a verificação é a execução dele. Se ele depende de um
        serviço externo, a tarefa declara como esse serviço é provido
      - **nunca derive valores do que já está persistido.** Um enum, um conjunto de estados,
        uma constraint - todos vêm da spec, jamais do schema do banco, de uma migration ou
        de dados existentes. Uma tarefa que diz "criar o enum com os literais já
        persistidos" inverteu a fonte de verdade

      Exemplo:
      ```
      ## 1. Configuração

      - [ ] 1.1 Criar o esqueleto do módulo e confirmar que os arquivos esperados existem
      - [ ] 1.2 Adicionar a dependência e confirmar que a instalação funciona

      ## 2. Exportação

      - [ ] 2.1 Implementar o escritor de CSV e confirmar que os testes unitários passam
      - [ ] 2.2 Ligar o endpoint de export e confirmar que o teste de integração passa
      ```

      Numa change com `parallel: true` no `.change.yaml`, uma tarefa pode declarar
      opcionalmente quais arquivos toca e de qual outra depende, entre crases, para
      participar do agendamento de dispatch paralelo:

      ```
      - [ ] 2.1 Implementar o escritor de CSV `files: src/export/csv.ts` — confirma testes unitários
      - [ ] 2.2 Ligar o endpoint de export `files: src/api/export.ts` `depends: 2.1` — confirma teste de integração
      ```

      Uma tarefa sem essas tags continua funcionando exatamente como antes - as tags são
      só uma dica de agendamento, nunca obrigatórias.

      **Por que a regra sobre teste pulado existe.** Num projeto real, três tarefas foram
      escritas assim e as três foram marcadas como concluídas:

      - "executar a suíte completa, confirmando que os testes PostgreSQL continuam
        condicionados a TEST_DATABASE_URL"
      - "criar teste opt-in, confirmar que a suíte padrão o ignora sem URL"
      - "executar a suíte completa com pytest -q" - comando que pula o teste E2E que aquela
        mesma change entregou

      A change entregou um teste de ponta a ponta e a verificação dela confirmou que ele é
      ignorado. Nenhum artefato do projeto registra que a suíte PostgreSQL ou o E2E algum dia
      tenham passado. O efeito prático foi grave: a garantia central do produto - não entregar
      o mesmo item a dois atendentes - dependia de `SELECT ... FOR UPDATE SKIP LOCKED`, que o
      SQLite da suíte padrão descarta em silêncio, e nunca foi exercida.

      Uma verificação que confirma um skip é uma tarefa que se autoaprova.

      **Por que a regra sobre derivar do schema existe.** No mesmo projeto, uma change
      inventou o valor `transferred` numa check constraint sem nenhum requisito por trás. A
      change seguinte recebeu a tarefa "criar o tipo de evento com os literais JÁ
      PERSISTIDOS" - e assim o schema virou fonte de verdade acima da spec. As duas changes
      seguintes adiaram, e nada nunca implementou o comportamento. Sobrou um valor de enum
      no domínio e no banco que requisito nenhum justifica, e que ninguém consegue remover
      com segurança porque não se sabe o que ele deveria significar.

      **A change de entrega.** Quando a change é a que fecha um projeto ou um milestone e
      produz documentação pública - README, guia de operação, referência de API - três
      regras extras valem:

      1. **As tarefas saem do que a fonte exige, não de prosa livre.** Se o documento-fonte
         enumera o que a documentação precisa ter, gere uma tarefa por item enumerado. Num
         projeto real a fonte listava dez itens para o README; a change de entrega escreveu
         suas tarefas de cabeça e dois deles - arquitetura e migrations - simplesmente não
         apareceram na lista.
      2. **Checklist em documento shipado é preenchido ou removido.** Um "checklist de
         aceite" com sete caixas desmarcadas foi entregue por uma tarefa marcada `[x]`.
      3. **Voz presente e completa.** Documento público não fala na voz de uma change
         intermediária. "A autorização chega na change de políticas" e "filas herdarão estas
         políticas pelas próximas changes" foram shipados depois de as duas coisas já terem
         acontecido, e "o typecheck cobre os módulos alterados desta change" vazou vocabulário
         interno para o leitor externo. Escreva sobre o sistema como ele é agora.

      Conteúdo mínimo de um README de entrega, para adaptar ao que o projeto é - cada item
      que sobreviver à adaptação vira uma tarefa: objetivo do sistema; **arquitetura**
      (camadas, regra de dependência, onde cada coisa mora); requisitos de ambiente;
      inicialização em ambiente limpo; variáveis de configuração e quais são só de
      desenvolvimento; **migrations** (como rodar, como criar, quando rodam sozinhas);
      credenciais de desenvolvimento e como desligá-las; contrato da API; **como rodar os
      testes, incluindo os que a suíte padrão pula e como habilitá-los**; matriz de
      permissões; diagnóstico operacional.

      O item dos testes merece destaque: uma suíte que termina verde pulando trinta e um
      testes, documentada como "rode pytest", engana quem lê.

      Use as specs para o que construir e o design para como construir.

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Leia os artefatos da change, percorra as tarefas não marcadas em ordem e marque cada
    box conforme a verificação dela passa. Pare e pergunte quando bater num impedimento ou
    numa decisão que não foi tomada.

    Numa change com `parallel: true`, rodada num harness que suporta dispatch paralelo, as
    tarefas prontas e sem conflito declarado entre si podem ser trabalhadas em lote, cada
    uma isolada num worktree próprio - veja o passo 2b do comando de implementação.
